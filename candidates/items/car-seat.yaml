# Infant car seat candidates. See categories/car-seat/README.md and candidates/schema.yaml.
# Shortlist of 2026-11-27, built from the market survey (0001 gate) and the
# usability notes of the same date (AGENTS.md rule 8). The seats it beat are
# in research/notes/; they are not listed here.

- id: uppababy-aria-v2
  name: UPPAbaby Aria V2 (1002-ARI, US)
  category: car-seat
  status: selected
  summary: >-
    Selected under [ADR 0004](../../decisions/0004-buy-the-uppababy-aria-v2.md).
    Its base has a load leg and an anti-rebound panel
    ([market survey](../../research/notes/2026-11-27-infant-car-seat-market-survey.md)),
    and sled tests link a load leg to lower head injury measures
    ([load-leg note](../../research/notes/2026-11-28-load-leg-sled-test-evidence.md)). It
    goes in our Model Y on LATCH, which avoids its weak belt lock-off
    ([BabyGearLab V2](https://www.babygearlab.com/reviews/vehicle-safety/infant-car-seat/uppababy-aria-v2)), and
    it has the lightest carrier, about 7 lb as used
    ([aria-v2 usability note](../../research/notes/2026-11-27-uppababy-aria-v2-usability.md)). Its costs: only one way
    to install without the base, a 30 in limit, an unreliable tightness
    indicator, and no technician review of the V2 yet
    ([hands-on and fit note](../../research/notes/2026-11-28-uppababy-aria-v2-hands-on-and-fit-update.md)).
  brand: UPPAbaby
  price_usd: 399.99
  vendor_url: https://uppababy.com/car-seats/infant/aria-v2/james/
  decision: "0004"
  specs:
    weight_lb: 7          # as used, about 7 lb; maker's 6 lb leaves out canopy and insert
    child_weight_lb: [4, 30]
    child_height_in_max: 30
    base_width_in: null
    expiry_years: 10      # manual rev. 260724; V1 was 7
    faa_approved: true
    aircraft_install: carrier only, without the base
    carrier_width_in: 17
  safety:
    standards: [FMVSS 213, FMVSS 213a]
    recalls: []
    checked_on: "2026-11-28"
  pros:
    - Lightest carrier on the shortlist, about 7 lb as used ([aria-v2 usability note](../../research/notes/2026-11-27-uppababy-aria-v2-usability.md)).
    - Baseless European-routing install was "super stable and firm" with no towel ([BabyGearLab V2](https://www.babygearlab.com/reviews/vehicle-safety/infant-car-seat/uppababy-aria-v2)). The Mesa V3 tested just as stable, so this is not an advantage over it.
    - Base has a load leg and an anti-rebound panel ([market survey](../../research/notes/2026-11-27-infant-car-seat-market-survey.md)). A peer-reviewed sled study linked a support leg to significant reductions in head injury measures ([load-leg note](../../research/notes/2026-11-28-load-leg-sled-test-evidence.md)).
    - Canopy rated "as close to perfect as an infant carrier can get" ([BabyGearLab V2](https://www.babygearlab.com/reviews/vehicle-safety/infant-car-seat/uppababy-aria-v2)).
    - No-rethread harness with 25 headrest positions ([maker](https://uppababy.com/car-seats/infant/aria-v2/james/)).
  cons:
    - "Misuse risk: the base's tightness indicator turned green before the base was tight, on V1 and on V2 (BabyGearLab [V1](https://www.babygearlab.com/reviews/vehicle-safety/infant-car-seat/uppababy-aria), [V2](https://www.babygearlab.com/reviews/vehicle-safety/infant-car-seat/uppababy-aria-v2)); owners also report it falling back to red after driving (low confidence), as Mesa V3 owners do. [CR (V1)](https://www.consumerreports.org/babies-kids/car-seats/uppababy-aria/m415804/) lists the indicator as a pro, so the labs conflict. Always do the manual's 1-inch movement test."
    - "Misuse risk: on a vehicle-belt base install, the belt could slip in the lock-off when shaken ([BabyGearLab V2](https://www.babygearlab.com/reviews/vehicle-safety/infant-car-seat/uppababy-aria-v2)). A [Texas A&M KidSafe install demo](https://www.youtube.com/watch?v=Vnq3Cp1Qxj0) got no movement with it, so V2 evidence conflicts. LATCH install avoids the question."
    - "Misuse risk: European routing is the only baseless method allowed; if a shoulder belt cannot reach around the shell, the [V2 manual](https://back.prod.uppababy.com/media/4b/51/e9/1794583326/US-EN_1002-ARI_AriaV2Manual_260724.pdf) offers only customer service, no fallback. A car seat with a lap-only belt cannot take the carrier without its base (V1 allowed it)."
    - "Inflatable vehicle seat belts are banned for every install, with or without the base ([V2 manual](https://back.prod.uppababy.com/media/4b/51/e9/1794583326/US-EN_1002-ARI_AriaV2Manual_260724.pdf) p. 27)."
    - Outgrown by height sooner than most infant seats (30 in limit; [CPST con on Babylist](https://www.babylist.com/hello-baby/uppababy-vs-nuna); [V1 head-room data](https://csftl.org/uppababy-aria-rear-facing-only-car-seat-review/); [V2 owner reports](../../research/notes/2026-11-28-uppababy-aria-v2-hands-on-and-fit-update.md) are mostly from an incentivized testing panel). Low confidence.
    - Harness tightener has more resistance than most; hard to get snug without over-tightening ([BabyGearLab V2](https://www.babygearlab.com/reviews/vehicle-safety/infant-car-seat/uppababy-aria-v2)).
    - Stroller range is UPPAbaby strollers plus Mockingbird adapters ([market survey](../../research/notes/2026-11-27-infant-car-seat-market-survey.md)).
    - Not rated by NHTSA ease-of-use in the current feed ([nhtsa ease-of-use note](../../research/notes/2026-11-27-nhtsa-ease-of-use-ratings.md)).
  notes: |
    - The weight is the as-used figure: [BabyGearLab](https://www.babygearlab.com/reviews/vehicle-safety/infant-car-seat/uppababy-aria-v2) 6.8 lb measured, [CSFTL](https://csftl.org/uppababy-aria-rear-facing-only-car-seat-review/) 7 lb fully dressed on V1, [retailer](https://www.modernnursery.com/products/uppababy-aria-v2-infant-car-seat) 7.1 lb.
    - The [maker's](https://uppababy.com/car-seats/infant/aria-v2/james/) 6 lb excludes canopy and insert.
    - Recall check 2026-11-28: [NHTSA childSeats API](https://api.nhtsa.gov/childSeats?dataSet=safetyIssues&max=127&offset=7400) record "UPPABABY | ARIA" shows 0 recalls, 0 investigations, 1 complaint (fabric torn by Velcro in the wash).
    - Consumer Reports has not tested V2; its V1 page scored 78 (16th of 46), crash protection "Better" ([read through Nick's CR account](https://www.consumerreports.org/babies-kids/car-seats/uppababy-aria/m415804/)).
    - No CPST hands-on review of V2 exists yet; fit evidence is V1 or incentivized V2 owner reviews ([hands-on and fit note](../../research/notes/2026-11-28-uppababy-aria-v2-hands-on-and-fit-update.md)).
    - The aircraft method is lap belt only, carrier only ([manual](https://back.prod.uppababy.com/media/4b/51/e9/1794583326/US-EN_1002-ARI_AriaV2Manual_260724.pdf) pp. 52-54).
    - Unknown: Model Y recline without a towel; our Model Y always uses the base ([stroller and Model Y note](../../research/notes/2026-11-28-uppababy-aria-v2-on-stroller-and-model-y.md)).
    - Unknown: fit at 9-12 months ([hands-on and fit note](../../research/notes/2026-11-28-uppababy-aria-v2-hands-on-and-fit-update.md)).
    - Unknown: carrier height on a stroller, open question 28 ([stroller and Model Y note](../../research/notes/2026-11-28-uppababy-aria-v2-on-stroller-and-model-y.md)).
    - Unknown: base width ([market survey](../../research/notes/2026-11-27-infant-car-seat-market-survey.md)).
    - Price seen during Black Friday 2026 ([market survey](../../research/notes/2026-11-27-infant-car-seat-market-survey.md)).
  research_notes:
    - 2026-11-27-infant-car-seat-market-survey.md
    - 2026-11-27-fmvss-213a-status-and-infant-seats.md
    - 2026-11-27-nhtsa-ease-of-use-ratings.md
    - 2026-11-27-uppababy-aria-v2-usability.md
    - 2026-11-28-uppababy-aria-v2-carrier-only-install.md
    - 2026-11-28-uppababy-aria-v2-hands-on-and-fit-update.md
    - 2026-11-28-uppababy-aria-v2-on-stroller-and-model-y.md
    - 2026-11-28-consumer-reports-infant-seats.md
    - 2026-11-28-infant-seats-firecrawl-retry.md
    - 2026-11-28-load-leg-sled-test-evidence.md
- id: uppababy-mesa-v3
  name: UPPAbaby Mesa V3 (US)
  category: car-seat
  status: shortlisted
  summary: >-
    Fits the same UPPAbaby strollers as the Aria V2, with a 32 in height
    limit and three ways to install without the base
    ([V3 manual](https://back.prod.uppababy.com/media/eb/4b/cc/1767623777/US-EN_1003-MSA_MesaV3Manual_251226.pdf)).
    Its base has no load leg
    ([market survey](../../research/notes/2026-11-27-infant-car-seat-market-survey.md)), and
    [BabyGearLab](https://www.babygearlab.com/reviews/vehicle-safety/infant-car-seat/uppababy-mesa-v3)
    found its LATCH install not the most stable in the group. The carrier
    weighs about 10.9 lb (measured). [NHTSA](https://api.nhtsa.gov/childSeats?dataSet=ratings&max=100&offset=0)
    rated the older V2 5 stars for ease of use; the V3 is not rated.
  brand: UPPAbaby
  price_usd: 349.99
  vendor_url: https://uppababy.com/car-seats/infant/mesa-v3/james/
  decision: "0004"
  specs:
    weight_lb: 10.9       # BabyGearLab measured on V3; maker says 9.9
    child_weight_lb: [4, 30]
    child_height_in_max: 32
    base_width_in: null
    expiry_years: 10      # manual rev. 251226; rev. 250529 said 7
    faa_approved: true
    aircraft_install: carrier only, without the base
    carrier_width_in: 17
  safety:
    standards: [FMVSS 213, FMVSS 213a]
    recalls: []
    checked_on: "2026-11-27"
  pros:
    - Baseless European-routing install "remarkably stable compared to competitors", no towel ([BabyGearLab V3](https://www.babygearlab.com/reviews/vehicle-safety/infant-car-seat/uppababy-mesa-v3)).
    - Three baseless methods allowed (European, optional lap/shoulder, lap-only), so it has a fallback in taxis ([V3 manual](https://back.prod.uppababy.com/media/eb/4b/cc/1767623777/US-EN_1003-MSA_MesaV3Manual_251226.pdf)).
    - 32 in height limit, longer than the Aria V2 and KeyFit 30 ([manual](https://back.prod.uppababy.com/media/eb/4b/cc/1767623777/US-EN_1003-MSA_MesaV3Manual_251226.pdf)).
    - "[NHTSA ease-of-use](https://api.nhtsa.gov/childSeats?dataSet=ratings&max=100&offset=0) rated the Mesa V2 5 stars in every category; V3 not rated (older version)."
    - Canopy "one of the best in the group" and never hits the handle ([BabyGearLab V3](https://www.babygearlab.com/reviews/vehicle-safety/infant-car-seat/uppababy-mesa-v3)).
    - No-rethread harness with 25 headrest positions ([maker](https://uppababy.com/car-seats/infant/mesa-v3/james/)).
  cons:
    - "Misuse risk: a CPST saw the base's tightness indicator show green while the base was \"still way too loose\" ([The Car Seat Lady](https://thecarseatlady.com/icsbg-uppababy/), original Mesa base; same base family, not retested on V3). Always do the manual's 1-inch movement test."
    - "Misuse risk: two owners report the base indicator going from green back to red while driving ([Babylist](https://www.babylist.com/gp/uppababy-mesa-v3/74913/2528374), 2026-09-29), the same symptom Aria V2 owners report. Low confidence."
    - "Misuse risk: the lock-off does little to hold the base on a vehicle belt; it \"rocked fairly easily\" under force ([BabyGearLab V3](https://www.babygearlab.com/reviews/vehicle-safety/infant-car-seat/uppababy-mesa-v3)). LATCH install avoids this."
    - Several owners report a newborn's head falling chin to chest; one baby failed a car seat test with the newborn insert and passed without it ([Babylist owner reviews](https://www.babylist.com/gp/uppababy-mesa-v3/74913/2528374)). Low confidence.
    - Consumer Reports has not tested V3; the Mesa V2 scored 68 (24th of 46) and is not CR Recommended ([read through Nick's CR account](https://www.consumerreports.org/babies-kids/car-seats/uppababy-mesa-v2/m408511/)).
    - Carrier measured 10.9 lb on V3, against the maker's 9.9 lb ([BabyGearLab](https://www.babygearlab.com/reviews/vehicle-safety/infant-car-seat/uppababy-mesa-v3)).
    - Buckle is stiff to press; the latch plates must be pulled out ([BabyGearLab V3](https://www.babygearlab.com/reviews/vehicle-safety/infant-car-seat/uppababy-mesa-v3)).
    - Manual mixes a "bubble" instruction with its green/red level marker ([V2](https://back.uppababy.com/media/d9/9b/d9/1745851419/1002-MESAV2-ProductManual_240509_US.pdf?ts=1745851419) and [V3](https://back.prod.uppababy.com/media/eb/4b/cc/1767623777/US-EN_1003-MSA_MesaV3Manual_251226.pdf) manuals).
    - Stroller range is UPPAbaby strollers plus Mockingbird adapters; not on Thule's chart ([market survey](../../research/notes/2026-11-27-infant-car-seat-market-survey.md)).
  notes: |
    - Fallback under [ADR 0004](../../decisions/0004-buy-the-uppababy-aria-v2.md) if the Aria V2 fails the Model Y test install.
    - Expiry depends on the manual revision printed for the unit: 7 years ([rev. 250529](https://back.prod.uppababy.com/media/a7/fb/b5/1752587108/1003-MSA-US_MesaV3Manual-EN_250529.pdf)) or 10 years ([rev. 251226](https://back.prod.uppababy.com/media/eb/4b/cc/1767623777/US-EN_1003-MSA_MesaV3Manual_251226.pdf)); check the label.
    - BabyGearLab's [2023 V2 test](https://www.babygearlab.com/reviews/vehicle-safety/infant-car-seat/uppababy-mesa-v2) found the level indicator narrow and hard to read; its [2026 V3 test](https://www.babygearlab.com/reviews/vehicle-safety/infant-car-seat/uppababy-mesa-v3) found it forgiving.
    - No CPST hands-on review of V3 daily use exists ([mesa-v3 usability note](../../research/notes/2026-11-27-uppababy-mesa-v3-usability.md)).
    - Recall check is a text search of [NHTSA's flat file](https://static.nhtsa.gov/odi/ffdd/rcl/FLAT_RCL_POST_2010.zip).
    - Unknown: Model Y recline without a towel ([mesa-v3 usability note](../../research/notes/2026-11-27-uppababy-mesa-v3-usability.md)).
    - Unknown: fit at 4 and 7 months ([mesa-v3 usability note](../../research/notes/2026-11-27-uppababy-mesa-v3-usability.md)).
    - Unknown: durability ([mesa-v3 usability note](../../research/notes/2026-11-27-uppababy-mesa-v3-usability.md)).
    - Unknown: carrier height on a stroller, open question 28 ([mesa-v3 usability note](../../research/notes/2026-11-27-uppababy-mesa-v3-usability.md)).
    - Unknown: base width ([market survey](../../research/notes/2026-11-27-infant-car-seat-market-survey.md)).
    - Price seen during Black Friday 2026 ([market survey](../../research/notes/2026-11-27-infant-car-seat-market-survey.md)).
  research_notes:
    - 2026-11-27-infant-car-seat-market-survey.md
    - 2026-11-27-fmvss-213a-status-and-infant-seats.md
    - 2026-11-27-nhtsa-ease-of-use-ratings.md
    - 2026-11-27-uppababy-mesa-v3-usability.md
    - 2026-11-27-faa-car-seat-use-on-aircraft.md
    - 2026-11-27-airline-seat-width-vs-infant-carriers.md
    - 2026-11-27-model-y-infant-seat-fit-and-load-leg.md
    - 2026-11-28-consumer-reports-infant-seats.md
