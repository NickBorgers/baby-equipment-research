# Stroller candidates. See categories/stroller/README.md and candidates/schema.yaml.
# First round 2026-11-28: strollers that take the Aria V2 (ADR 0004), checked
# against the 0003 gates (newborn-capable alone, about 50 lb, maker-listed
# adapter). Specs only so far; usability is not yet judged (AGENTS.md rule 8).

- id: uppababy-minu-v3
  name: UPPAbaby Minu V3 (0803-MIN, US)
  category: stroller
  status: candidate
  brand: UPPAbaby
  price_usd: 499.99
  vendor_url: https://uppababy.com/strollers/lightweight/minu-v3/james/
  specs:
    weight_lb: 16.7          # maker "True weight"; BabyGearLab measured 16.7
    folded_in: [21.5, 18, 10]  # maker; BabyGearLab measured 21.6 x 17.6 x 9.2
    open_width_in: 18
    seat_recline: infinite; BabyGearLab measured 157.7°, not fully flat
    max_child_lb: 50
    one_hand_fold: null      # maker says one-handed; BabyGearLab "Maybe for some"
    wheels: polyurethane, all-wheel suspension
  safety:
    standards: []
    recalls: []
    checked_on: "2026-11-28"
  compat:
    accepts_car_seats: []
    needs_adapter:
      uppababy-aria-v2: Adapters for Minu V3 (Aria & Mesa), 0904-MMA-WW
      uppababy-mesa-v3: Adapters for Minu V3 (Aria & Mesa), 0904-MMA-WW
    incompatible: []
  pros:
    - Toddler seat approved from birth to 50 lb with no add-on (US manual 250127).
    - Lightest and smallest folded of the UPPAbaby line, 16.7 lb (maker and BabyGearLab).
    - Smooth on pavement and up curbs; CR maneuverability 5/5 (usability note).
    - Canopy is large with a mesh window and UPF 50+; stands when folded (BabyGearLab, CR).
    - The $99.99 travel bag includes TravelSafe, covering air-travel damage for 4 years (maker).
  cons:
    - "Misuse risk: the adapter's colour dots show it is on the frame, not that the carrier is latched. Lift the carrier every time (maker; Aria V2 manual)."
    - "Misuse risk: newborn use needs the full recline and the rear crotch slot; the seat is not fully flat (157.7°, BabyGearLab), and two reviewers would hesitate with a tiny newborn."
    - "Misuse risk: one owner says the brake held only one wheel (snippet only). Check both wheels."
    - No hands-on test of any Aria or Mesa on the Minu V3 found; lock feel, wobble and carrier height unknown.
    - Small wheels struggle on gravel, cobbles and grass (CR, MadeForMums, BabyGearLab).
    - Handlebar does not adjust; fold is one-handed for some testers but not others.
    - Needs a $39.99 adapter for the Aria V2.
    - Does not fit the 22 x 14 x 9 in overhead bin on published or measured size, despite the maker's "fits in any overhead bin" claim.
    - No bassinet or newborn insert made for it.
    - Bumper bar is a $39.99 extra.
    - One unverified consumer report (SaferProducts.gov, 2024) says a Minu V2 with Mesa adapters released the car seat going downhill. Older model; lift the carrier to check the latch every time.
  notes: >-
    The car seat attaches with the seat fully reclined (adapter page).
    Unknown: as-used weight with canopy, bumper bar and adapters; folded
    size with adapters on; carrier height on the stroller (open question
    28); usability not yet researched.
  research_notes:
    - 2026-11-28-stroller-recall-check-method.md
    - 2026-11-28-uppababy-strollers-specs-and-gates.md
    - 2026-11-28-uppababy-aria-v2-on-stroller-and-model-y.md
    - 2026-11-28-uppababy-minu-v3-usability.md

- id: uppababy-kona
  name: UPPAbaby Kona (2201-KNA, US)
  category: stroller
  status: candidate
  brand: UPPAbaby
  price_usd: 649.99
  vendor_url: https://uppababy.com/strollers/full-size/kona/james/
  specs:
    weight_lb: 22            # maker "Frame & seat"; bundle page says 21.2; not measured
    folded_in: [25.8, 21, 13.4]  # maker, with seat
    open_width_in: 21
    seat_recline: 4 positions; maker says "lay-flat" and "near-flat"
    max_child_lb: 50
    one_hand_fold: null      # Babylist says one hand; owners say it sticks
    wheels: never-flat tires, all-wheel suspension
  safety:
    standards: []
    recalls: []
    checked_on: "2026-11-28"
  compat:
    accepts_car_seats: [uppababy-aria-v2]
    needs_adapter: {}
    incompatible: []
  pros:
    - Toddler seat approved from birth to 50 lb with no add-on (US manual 260710).
    - UPPAbaby sells it as a Kona + Aria V2 bundle; the seat "attaches directly" (bundle page, help centre 2026-09-25).
    - Lighter than the Cruz V3 and Vista V3 (22 lb, maker); folds with the seat on either way; travel bag needs no wheel removal ($149.99).
  cons:
    - "Misuse risk: no manual describes attaching the Aria V2 to the Kona or checking it. The Kona manual has no car seat section, and the Aria V2 manual (rev. 260724) does not list the Kona."
    - "Misuse risk: UPPAbaby's bundle page says the carrier can face outward on the Kona; the Aria V2 manual allows parent-facing only."
    - Ride over bumps is "good, but not great", rougher than the Cruz and Vista (Babylist); seat sits low and the handlebar wobbles when fully extended.
    - Fold gets stuck for some owners (low confidence); no measured weight or fold; only one hands-on write-up.
    - Does not fit the 22 x 14 x 9 in overhead bin.
  notes: >-
    New in 2026. Aria V2 compat is recorded from UPPAbaby's bundle page and
    help centre, not a manual (open question 44). The Mesa V3 is left
    unknown. Unknown: carrier height and stability, measured weight and
    fold, gate-check durability.
  research_notes:
    - 2026-11-28-stroller-recall-check-method.md
    - 2026-11-28-uppababy-strollers-specs-and-gates.md
    - 2026-11-28-uppababy-full-size-usability.md

- id: uppababy-cruz-v3
  name: UPPAbaby Cruz V3 (0403-CRZ, US)
  category: stroller
  status: candidate
  brand: UPPAbaby
  price_usd: 899.99
  vendor_url: https://uppababy.com/strollers/full-size/cruz-v3/james/
  specs:
    weight_lb: 26.5          # maker "Frame & Seat"; BabyGearLab table 26.5
    folded_in: [32.5, 22.5, 17]  # maker, with seat; 30.3 x 22.5 x 13.5 without
    open_width_in: 22.5
    seat_recline: 4 positions, lay-flat
    max_child_lb: 50
    one_hand_fold: false     # BabyGearLab: "requires two hands"; maker says "one-step"
    wheels: foam-filled, all-wheel suspension
  safety:
    standards: []
    recalls: []
    checked_on: "2026-11-28"
  compat:
    accepts_car_seats: [uppababy-aria-v2, uppababy-mesa-v3]
    needs_adapter: {}
    incompatible: []
  pros:
    - Aria V2 attaches directly, no adapter (Aria V2 manual).
    - Toddler seat approved from birth to 50 lb; infant insert included (US manual 250711). With the insert the reclined seat "forms a nest-like structure" (The Bump, 2-month-old).
    - CR maneuverability 5/5; colour-coded single-action brake; 30 lb basket easy to reach (CR, BabyGearLab).
  cons:
    - "Misuse risk: the manual says never lift by the bumper bar, but reviewers find no other clear handhold when lifting it folded (The Bump, BabyGearLab)."
    - "Misuse risk: the carrier lock has only a click and a lift check, no visual indicator (Aria V2 manual)."
    - Bulky to lift into a trunk alone (The Bump); stiff suspension on cracks and bumps (BabyGearLab).
    - No hands-on test of an Aria or Mesa on it; carrier height unknown.
    - Does not fit the 22 x 14 x 9 in overhead bin; gate check only.
    - Fold needs two hands (BabyGearLab, CR).
  notes: >-
    Unknown: as-used weight with canopy and bumper; carrier height on the
    stroller (open question 28); usability not yet researched.
  research_notes:
    - 2026-11-28-stroller-recall-check-method.md
    - 2026-11-28-uppababy-strollers-specs-and-gates.md
    - 2026-11-28-uppababy-aria-v2-on-stroller-and-model-y.md
    - 2026-11-28-uppababy-full-size-usability.md

- id: uppababy-vista-v3
  name: UPPAbaby Vista V3 (0303-VSO, US)
  category: stroller
  status: candidate
  brand: UPPAbaby
  price_usd: 999.99
  vendor_url: https://uppababy.com/strollers/full-size/vista-v3/james/
  specs:
    weight_lb: 27.9          # BabyGearLab measured; maker 27.6 "Frame & Seat"
    folded_in: [33.8, 25.7, 16.3]  # maker, with seat; 32.3 x 25.7 x 11.3 without
    open_width_in: 25.7
    seat_recline: 6 positions
    max_child_lb: 50
    one_hand_fold: false     # BabyGearLab: "requires two hands"
    wheels: foam-filled, all-wheel suspension
  safety:
    standards: []
    recalls: []
    checked_on: "2026-11-28"
  compat:
    accepts_car_seats: [uppababy-aria-v2, uppababy-mesa-v3]
    needs_adapter: {}
    incompatible: []
  pros:
    - Aria V2 attaches directly, no adapter (Aria V2 manual).
    - Canopy called "the best canopy I've ever used on a stroller" (CR); CR maneuverability 5/5; 30 lb basket.
  cons:
    - Toddler seat is from 3 months only; from birth it needs the Infant SnugSeat ($69.99) or Bassinet V3 ($279.99), neither included (US manual 251118).
    - Heaviest and widest folded of the strollers that pass 0003 alone, apart from Ridge V2; does not fit the overhead bin.
    - Fold needs two hands and several set-up steps (BabyGearLab, CR, help centre); pinches fingers when lifted folded (BabyGearLab).
    - Reviews conflict on rough ground; CR's tester found it "rattly, almost rickety" on cobblestones.
    - No hands-on test of the SnugSeat, or of an Aria or Mesa on it.
    - Highest price of the line, $999.99.
  notes: >-
    Can convert to a double; not needed now. Unknown: carrier height on the
    stroller; usability not yet researched.
  research_notes:
    - 2026-11-28-stroller-recall-check-method.md
