# Stroller candidates. See categories/stroller/README.md and candidates/schema.yaml.
# First round 2026-11-28: strollers that take the Aria V2 (ADR 0004), checked
# against the 0003 gates (newborn-capable alone, about 50 lb, maker-listed
# adapter). Specs only so far; usability is not yet judged (AGENTS.md rule 8).

- id: uppababy-minu-v3
  name: UPPAbaby Minu V3 (0803-MIN, US)
  category: stroller
  status: candidate
  brand: UPPAbaby
  price_usd: 499.99
  vendor_url: https://uppababy.com/strollers/lightweight/minu-v3/james/
  specs:
    weight_lb: 16.7          # maker "True weight"; BabyGearLab measured 16.7
    folded_in: [21.5, 18, 10]  # maker; BabyGearLab measured 21.6 x 17.6 x 9.2
    open_width_in: 18
    seat_recline: infinite; BabyGearLab measured 157.7°, not fully flat
    max_child_lb: 50
    one_hand_fold: null      # maker says one-handed; BabyGearLab "Maybe for some"
    wheels: polyurethane, all-wheel suspension
  safety:
    standards: []
    recalls: []
    checked_on: "2026-11-28"
  compat:
    accepts_car_seats: []
    needs_adapter:
      uppababy-aria-v2: Adapters for Minu V3 (Aria & Mesa), 0904-MMA-WW
      uppababy-mesa-v3: Adapters for Minu V3 (Aria & Mesa), 0904-MMA-WW
    incompatible: []
  pros:
    - "Toddler seat approved from birth to 50 lb with no add-on ([US manual 250127](https://back.prod.uppababy.com/media/d6/b5/0a/1745851419/0803-MIN-NA-CN_MinuV3_Manual_250127.pdf))."
    - "Lightest and smallest folded of the UPPAbaby line, 16.7 lb ([maker](https://uppababy.com/strollers/lightweight/minu-v3/james/) and [BabyGearLab](https://www.babygearlab.com/reviews/getting-around/travel-stroller/uppababy-minu-v3))."
    - "Smooth on pavement and up curbs; CR maneuverability 5/5 ([usability note](../../research/notes/2026-11-28-uppababy-minu-v3-usability.md))."
    - "Canopy is large with a mesh window and UPF 50+; stands when folded ([BabyGearLab](https://www.babygearlab.com/reviews/getting-around/travel-stroller/uppababy-minu-v3), [CR](https://www.consumerreports.org/babies-kids/strollers/uppababy-minu-v3/m418632/))."
    - "The $99.99 travel bag includes TravelSafe, covering air-travel damage for 4 years ([maker](https://uppababy.com/accessories/strollers-accessories/minu-travelbag/))."
  cons:
    - "Misuse risk: the adapter's colour dots show it is on the frame, not that the carrier is latched. Lift the carrier every time ([maker](https://uppababy.com/accessories/strollers-accessories/adapters-for-minu-v3/); [Aria V2 manual](https://back.prod.uppababy.com/media/4b/51/e9/1794583326/US-EN_1002-ARI_AriaV2Manual_260724.pdf))."
    - "Misuse risk: newborn use needs the full recline and the rear crotch slot; the seat is not fully flat (157.7°, [BabyGearLab](https://www.babygearlab.com/reviews/getting-around/travel-stroller/uppababy-minu-v3)), and two reviewers would hesitate with a tiny newborn ([BabyGearLab](https://www.babygearlab.com/reviews/getting-around/travel-stroller/uppababy-minu-v3), [Mumsnet](https://www.mumsnet.com/reviews/uppababy-minu-v3-stroller-review))."
    - "Misuse risk: one owner says the brake held only one wheel (snippet only; [usability note](../../research/notes/2026-11-28-uppababy-minu-v3-usability.md)). Check both wheels."
    - "No hands-on test of any Aria or Mesa on the Minu V3 found; lock feel, wobble and carrier height unknown ([usability note](../../research/notes/2026-11-28-uppababy-minu-v3-usability.md))."
    - "Small wheels struggle on gravel, cobbles and grass ([CR](https://www.consumerreports.org/babies-kids/strollers/uppababy-minu-v3/m418632/), [MadeForMums](https://www.madeformums.com/reviews/uppababy-minu-v3-pushchair-review), [BabyGearLab](https://www.babygearlab.com/reviews/getting-around/travel-stroller/uppababy-minu-v3))."
    - "Handlebar does not adjust; fold is one-handed for some testers but not others ([usability note](../../research/notes/2026-11-28-uppababy-minu-v3-usability.md))."
    - "Needs a $39.99 adapter for the Aria V2 ([specs note](../../research/notes/2026-11-28-uppababy-strollers-specs-and-gates.md))."
    - "Does not fit the 22 x 14 x 9 in overhead bin on published or measured size, despite the maker's \"fits in any overhead bin\" claim ([specs note](../../research/notes/2026-11-28-uppababy-strollers-specs-and-gates.md))."
    - "No bassinet or newborn insert made for it ([specs note](../../research/notes/2026-11-28-uppababy-strollers-specs-and-gates.md))."
    - "Bumper bar is a $39.99 extra ([specs note](../../research/notes/2026-11-28-uppababy-strollers-specs-and-gates.md))."
    - "One unverified consumer report ([SaferProducts.gov](https://www.saferproducts.gov/PublicSearch/Result?id=4843681&handler=Detail), 2024) says a Minu V2 with Mesa adapters released the car seat going downhill. Older model; lift the carrier to check the latch every time."
  notes: |
    - The car seat attaches with the seat fully reclined ([adapter page](https://uppababy.com/accessories/strollers-accessories/adapters-for-minu-v3/)).
    - Unknown: as-used weight with canopy, bumper bar and adapters ([specs note](../../research/notes/2026-11-28-uppababy-strollers-specs-and-gates.md)).
    - Unknown: folded size with adapters on ([specs note](../../research/notes/2026-11-28-uppababy-strollers-specs-and-gates.md)).
    - Unknown: carrier height on the stroller, open question 28 ([Aria V2 stroller note](../../research/notes/2026-11-28-uppababy-aria-v2-on-stroller-and-model-y.md)).
    - Usability not yet researched.
  research_notes:
    - 2026-11-28-stroller-recall-check-method.md
    - 2026-11-28-uppababy-strollers-specs-and-gates.md
    - 2026-11-28-uppababy-aria-v2-on-stroller-and-model-y.md
    - 2026-11-28-uppababy-minu-v3-usability.md

- id: uppababy-kona
  name: UPPAbaby Kona (2201-KNA, US)
  category: stroller
  status: candidate
  brand: UPPAbaby
  price_usd: 649.99
  vendor_url: https://uppababy.com/strollers/full-size/kona/james/
  specs:
    weight_lb: 22            # maker "Frame & seat"; bundle page says 21.2; not measured
    folded_in: [25.8, 21, 13.4]  # maker, with seat
    open_width_in: 21
    seat_recline: 4 positions; maker says "lay-flat" and "near-flat"
    max_child_lb: 50
    one_hand_fold: null      # Babylist says one hand; owners say it sticks
    wheels: never-flat tires, all-wheel suspension
  safety:
    standards: []
    recalls: []
    checked_on: "2026-11-28"
  compat:
    accepts_car_seats: [uppababy-aria-v2]
    needs_adapter: {}
    incompatible: []
  pros:
    - "Toddler seat approved from birth to 50 lb with no add-on ([US manual 260710](https://back.uppababy.com/media/2d/bd/8a/1790001116/NA_2201-KNA_KonaManual_260710_a11y.pdf))."
    - "UPPAbaby sells it as a Kona + Aria V2 bundle; the seat \"attaches directly\" ([bundle page](https://uppababy.com/bundles/travel-systems/kona-aria-v2-travel-system), [help centre 2026-09-25](https://support.uppababy.com/hc/en-us/articles/43763742563607))."
    - "Lighter than the Cruz V3 and Vista V3 (22 lb, [maker](https://uppababy.com/strollers/full-size/kona/james/)); folds with the seat on either way; [travel bag](https://uppababy.com/accessories/strollers-accessories/kona-travel-bag/) needs no wheel removal ($149.99)."
  cons:
    - "Misuse risk: no manual describes attaching the Aria V2 to the Kona or checking it. The [Kona manual](https://back.uppababy.com/media/2d/bd/8a/1790001116/NA_2201-KNA_KonaManual_260710_a11y.pdf) has no car seat section, and the [Aria V2 manual](https://back.prod.uppababy.com/media/4b/51/e9/1794583326/US-EN_1002-ARI_AriaV2Manual_260724.pdf) (rev. 260724) does not list the Kona."
    - "Misuse risk: UPPAbaby's [bundle page](https://uppababy.com/bundles/travel-systems/kona-aria-v2-travel-system) says the carrier can face outward on the Kona; the [Aria V2 manual](https://back.prod.uppababy.com/media/4b/51/e9/1794583326/US-EN_1002-ARI_AriaV2Manual_260724.pdf) allows parent-facing only."
    - "Ride over bumps is \"good, but not great\", rougher than the Cruz and Vista ([Babylist](https://www.babylist.com/hello-baby/best-strollers)); seat sits low and the handlebar wobbles when fully extended."
    - "Fold gets stuck for some owners (low confidence); no measured weight or fold; only one hands-on write-up ([usability note](../../research/notes/2026-11-28-uppababy-full-size-usability.md))."
    - "Does not fit the 22 x 14 x 9 in overhead bin ([specs note](../../research/notes/2026-11-28-uppababy-strollers-specs-and-gates.md))."
  notes: |
    - New in 2026 ([press release](https://uppababy.com/blog/uppababy-unveils-kona-a-stroller-built-for-how-modern-parents-actually-move)).
    - Aria V2 compat is recorded from UPPAbaby's [bundle page](https://uppababy.com/bundles/travel-systems/kona-aria-v2-travel-system) and [help centre](https://support.uppababy.com/hc/en-us/articles/43763742563607), not a manual (open question 44).
    - The Mesa V3 is left unknown ([usability note](../../research/notes/2026-11-28-uppababy-full-size-usability.md)).
    - Unknown: carrier height and stability ([usability note](../../research/notes/2026-11-28-uppababy-full-size-usability.md)).
    - Unknown: measured weight and fold ([specs note](../../research/notes/2026-11-28-uppababy-strollers-specs-and-gates.md)).
    - Unknown: gate-check durability ([usability note](../../research/notes/2026-11-28-uppababy-full-size-usability.md)).
  research_notes:
    - 2026-11-28-stroller-recall-check-method.md
    - 2026-11-28-uppababy-strollers-specs-and-gates.md
    - 2026-11-28-uppababy-full-size-usability.md

- id: uppababy-cruz-v3
  name: UPPAbaby Cruz V3 (0403-CRZ, US)
  category: stroller
  status: candidate
  brand: UPPAbaby
  price_usd: 899.99
  vendor_url: https://uppababy.com/strollers/full-size/cruz-v3/james/
  specs:
    weight_lb: 26.5          # maker "Frame & Seat"; BabyGearLab table 26.5
    folded_in: [32.5, 22.5, 17]  # maker, with seat; 30.3 x 22.5 x 13.5 without
    open_width_in: 22.5
    seat_recline: 4 positions, lay-flat
    max_child_lb: 50
    one_hand_fold: false     # BabyGearLab: "requires two hands"; maker says "one-step"
    wheels: foam-filled, all-wheel suspension
  safety:
    standards: []
    recalls: []
    checked_on: "2026-11-28"
  compat:
    accepts_car_seats: [uppababy-aria-v2, uppababy-mesa-v3]
    needs_adapter: {}
    incompatible: []
  pros:
    - "Aria V2 attaches directly, no adapter ([Aria V2 manual](https://back.prod.uppababy.com/media/4b/51/e9/1794583326/US-EN_1002-ARI_AriaV2Manual_260724.pdf))."
    - "Toddler seat approved from birth to 50 lb; infant insert included ([US manual 250711](https://back.prod.uppababy.com/media/d4/ec/95/1755268188/NA_0403-CRZ_CruzV3Manual_250711_a11y.pdf)). With the insert the reclined seat \"forms a nest-like structure\" ([The Bump](https://www.thebump.com/a/uppababy-cruz-v3-review), 2-month-old)."
    - "CR maneuverability 5/5; colour-coded single-action brake; 30 lb basket easy to reach ([CR](https://www.consumerreports.org/babies-kids/strollers/uppababy-cruz-v3/m419563/), [BabyGearLab](https://www.babygearlab.com/reviews/getting-around/full-size-stroller/uppababy-cruz-v3))."
  cons:
    - "Misuse risk: the [manual](https://back.prod.uppababy.com/media/d4/ec/95/1755268188/NA_0403-CRZ_CruzV3Manual_250711_a11y.pdf) says never lift by the bumper bar, but reviewers find no other clear handhold when lifting it folded ([The Bump](https://www.thebump.com/a/uppababy-cruz-v3-review), [BabyGearLab](https://www.babygearlab.com/reviews/getting-around/full-size-stroller/uppababy-cruz-v3))."
    - "Misuse risk: the carrier lock has only a click and a lift check, no visual indicator ([Aria V2 manual](https://back.prod.uppababy.com/media/4b/51/e9/1794583326/US-EN_1002-ARI_AriaV2Manual_260724.pdf))."
    - "Bulky to lift into a trunk alone ([The Bump](https://www.thebump.com/a/uppababy-cruz-v3-review)); stiff suspension on cracks and bumps ([BabyGearLab](https://www.babygearlab.com/reviews/getting-around/full-size-stroller/uppababy-cruz-v3))."
    - "No hands-on test of an Aria or Mesa on it; carrier height unknown ([usability note](../../research/notes/2026-11-28-uppababy-full-size-usability.md))."
    - "Does not fit the 22 x 14 x 9 in overhead bin; gate check only ([specs note](../../research/notes/2026-11-28-uppababy-strollers-specs-and-gates.md))."
    - "Fold needs two hands ([BabyGearLab](https://www.babygearlab.com/reviews/getting-around/full-size-stroller/uppababy-cruz-v3), [CR](https://www.consumerreports.org/babies-kids/strollers/uppababy-cruz-v3/m419563/))."
  notes: |
    - Unknown: as-used weight with canopy and bumper ([specs note](../../research/notes/2026-11-28-uppababy-strollers-specs-and-gates.md)).
    - Unknown: carrier height on the stroller, open question 28 ([Aria V2 stroller note](../../research/notes/2026-11-28-uppababy-aria-v2-on-stroller-and-model-y.md)).
    - Usability not yet researched.
  research_notes:
