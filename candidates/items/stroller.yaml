- id: mockingbird-travel-stroller
  name: Mockingbird Travel Stroller (2026)
  category: stroller
  status: candidate
  brand: Mockingbird
  price_usd: 399            # regular; $349 Black Friday 2026
  vendor_url: https://hellomockingbird.com/products/mockingbird-travel-stroller
  specs:
    weight_lb: 17.7          # maker; page's own table says 17.6; not measured
    folded_in: [21.5, 18, 10]  # maker
    open_width_in: 18
    seat_recline: lie-flat ("Infant Nest Mode", maker); not measured
    max_child_lb: 50
    one_hand_fold: true      # auto-fold; manual and several reviews
    wheels: airless, 5 in front / 6 in rear, all-wheel suspension
  safety:
    standards: []
    recalls: []
    checked_on: "2026-11-28"
  compat:
    accepts_car_seats: []
    needs_adapter:
      uppababy-aria-v2: FlexConnect strap adapter (included), or QuickConnect UPPAbaby Adapter ($50)
    incompatible: []
  pros:
    - "Newborn mode built in and included (\"Infant Nest Mode\"), to 50 lb ([maker](https://hellomockingbird.com/products/mockingbird-travel-stroller)); a [CPST reviewer](https://strollermom.com/stroller/mockingbird-travel-stroller-review/) called it \"so flat\" (sponsored, not measured)."
    - "One-hand auto-fold that stands on its own ([manual](https://app.air.inc/a/bfc7b665f/b/6b7f1b8d-e8c6-4c92-9537-a49613351860/c/0630ab14-4198-485c-9e30-878362ac6f41); [Babylist](https://www.babylist.com/hello-baby/best-strollers), [Stroller Mom](https://strollermom.com/stroller/mockingbird-travel-stroller-review/))."
    - "Handled cobblestones, gravel and uneven streets well ([Stroller Mom](https://strollermom.com/stroller/mockingbird-travel-stroller-review/), sponsored; [Babylist](https://www.babylist.com/hello-baby/best-strollers))."
    - "[Maker chart](https://help.hellomockingbird.com/en_us/which-car-seat-brands-and-models-are-compatible-with-the-mockingbird-travel-stroller-ByXtekfDfg) names the Aria V2 explicitly (November 2026); a strap adapter is included. Lifetime frame warranty ([maker](https://hellomockingbird.com/products/mockingbird-travel-stroller))."
  cons:
    - "Misuse risk: the FlexConnect strap is tightened by hand with no tension indicator; a loose, twisted or mis-routed strap gives no cue. The only check is pulling up on the carrier ([FlexConnect manual](https://app.air.inc/a/bfc7b665f/b/6b7f1b8d-e8c6-4c92-9537-a49613351860/c/eaeaefe3-ba80-4142-827c-bfd4c60a84c7))."
    - "Misuse risk: the adapter has a wrong peg (the Nest Mode peg) right beside the right one, and setup needs full recline, leg rest up, brake on and harness fastened ([manual](https://app.air.inc/a/bfc7b665f/b/6b7f1b8d-e8c6-4c92-9537-a49613351860/c/eaeaefe3-ba80-4142-827c-bfd4c60a84c7))."
    - "Misuse risk: straps left on the stroller are a strangulation hazard; remove them when not in use ([manual](https://app.air.inc/a/bfc7b665f/b/6b7f1b8d-e8c6-4c92-9537-a49613351860/c/eaeaefe3-ba80-4142-827c-bfd4c60a84c7))."
    - "No reviewer has used an UPPAbaby seat on it; carrier stability and height unknown ([usability note](../../research/notes/2026-11-28-mockingbird-travel-stroller-usability.md))."
    - "New in autumn 2026; no measured weight, no gate-check or durability reports yet. Main hands-on review is sponsored ([usability note](../../research/notes/2026-11-28-mockingbird-travel-stroller-usability.md))."
    - "Does not fit the 22 x 14 x 9 in overhead bin on published size, despite the maker's \"IATA-compliant\" claim ([strollers note](../../research/notes/2026-11-28-non-uppababy-strollers-for-aria-v2.md))."
    - "Earlier Mockingbird Single and Single-to-Double lots were recalled in 2022-23 because the lower frame could crack (CPSC [23-042](https://www.cpsc.gov/Recalls/2023/Mockingbird-Recalls-Single-to-Double-Strollers-Due-to-Fall-Hazard), [23-161](https://www.cpsc.gov/Recalls/2023/Mockingbird-Expands-Recall-to-Include-Single-Strollers-Due-to-Fall-Hazard)). Current models are not named."
  notes: |
    - The full-size Mockingbird adapter does not fit this stroller; it uses FlexConnect or QuickConnect ([strollers note](../../research/notes/2026-11-28-non-uppababy-strollers-for-aria-v2.md)).
    - The QuickConnect ($50) may give a click-in lock; its manual was not read ([usability note](../../research/notes/2026-11-28-mockingbird-travel-stroller-usability.md)).
    - Handlebar fixed at 41.5 in ([usability note](../../research/notes/2026-11-28-mockingbird-travel-stroller-usability.md)).
    - Basket 20 lb ([manual](https://app.air.inc/a/bfc7b665f/b/6b7f1b8d-e8c6-4c92-9537-a49613351860/c/0630ab14-4198-485c-9e30-878362ac6f41)).
    - Cannot fold in Nest Mode ([manual](https://app.air.inc/a/bfc7b665f/b/6b7f1b8d-e8c6-4c92-9537-a49613351860/c/0630ab14-4198-485c-9e30-878362ac6f41)).
    - Unknown: as-used weight, carrier height, gate-check durability ([usability note](../../research/notes/2026-11-28-mockingbird-travel-stroller-usability.md)).
  research_notes:
    - 2026-11-28-stroller-recall-check-method.md
    - 2026-11-28-non-uppababy-strollers-for-aria-v2.md
    - 2026-11-28-mockingbird-travel-stroller-usability.md

- id: zoe-tour-v3
  name: Zoe Tour V3
  category: stroller
  status: candidate
  brand: Zoe
  price_usd: 299
  vendor_url: https://zoebaby.com/products/zoe-tour-single-stroller
  specs:
    weight_lb: 14.5          # maker; same page also says "Only 13 pounds"; not measured
    folded_in: [26.75, 21.75, 10]  # maker, without belly bar
    open_width_in: 21.75
    seat_recline: 155° with included newborn cocoon (maker)
    max_child_lb: 60
    one_hand_fold: true      # one review and one owner; low confidence
    wheels: 6 in front / 6.25 in rear
  safety:
    standards: []
    recalls: []
    checked_on: "2026-11-28"
  compat:
    accepts_car_seats: []
    needs_adapter:
      uppababy-aria-v2: Tour V3 UPPAbaby Car Seat Adapter, model 810033595783 ($55)
      uppababy-mesa-v3: Tour V3 UPPAbaby Car Seat Adapter, model 810033595783 ($55)
    incompatible: []
  pros:
    - "Lightest stroller found that takes the Aria V2, 14.5 lb ([maker](https://zoebaby.com/products/zoe-tour-single-stroller))."
    - "Newborn cocoon included; seat rated to 60 lb; handlebar has three heights ([maker](https://zoebaby.com/products/zoe-tour-single-stroller))."
    - "Adapter clicks in, with a pull-up check ([adapter sheet](https://cdn.shopify.com/s/files/1/0251/0749/6994/files/Tour_V3_UPPAbaby_Adapter_Manual.pdf?v=1781483081))."
  cons:
    - "Misuse risk: two brake pedals, one per side; a [V3 reviewer](https://strollermom.com/stroller/zoe-strollers) and a [V3 owner](https://zoebaby.com/products/zoe-tour-single-stroller) flag it, and a [V2 tester](https://www.lucieslist.com/review/zoe-the-tour-stroller-review/) had the stroller roll when half-set."
    - "Misuse risk: the newborn wrap must be fastened or the leg-opening strangulation warning applies; the [manual](https://cdn.shopify.com/s/files/1/0251/0749/6994/files/Tour_V3_Manual.pdf?v=1781285525) names two different fastening points."
    - "The [manual](https://cdn.shopify.com/s/files/1/0251/0749/6994/files/Tour_V3_Manual.pdf?v=1781285525) bans use on \"rough roads\", which conflicts with daily walks on rough ground."
    - "Does not stand when folded; carry strap is a $20 extra; basket only 10 lb ([usability note](../../research/notes/2026-11-28-zoe-tour-v3-usability.md))."
    - "No reviewer has tested an UPPAbaby seat on it; the canopy may need to come off one side with the car seat on ([adapter sheet](https://cdn.shopify.com/s/files/1/0251/0749/6994/files/Tour_V3_UPPAbaby_Adapter_Manual.pdf?v=1781483081))."
    - "Usability evidence is thin; the fuller reviews are of the Tour V2, a different version ([usability note](../../research/notes/2026-11-28-zoe-tour-v3-usability.md))."
    - "Does not fit the 22 x 14 x 9 in overhead bin on published size; maker says only \"some overhead bins\" ([strollers note](../../research/notes/2026-11-28-non-uppababy-strollers-for-aria-v2.md))."
  notes: |
    - Adapter must come off before folding ([adapter sheet](https://cdn.shopify.com/s/files/1/0251/0749/6994/files/Tour_V3_UPPAbaby_Adapter_Manual.pdf?v=1781483081)).
    - CR rated a different Zoe model (the Traveler) "Do Not Buy" for tipping backward in 2026 ([usability note](../../research/notes/2026-11-28-zoe-tour-v3-usability.md)).
    - CR did not test the Tour V3 ([usability note](../../research/notes/2026-11-28-zoe-tour-v3-usability.md)).
    - Unknown: measured weight, carrier height, stability, flight experience ([usability note](../../research/notes/2026-11-28-zoe-tour-v3-usability.md)).
  research_notes:
    - 2026-11-28-stroller-recall-check-method.md
    - 2026-11-28-non-uppababy-strollers-for-aria-v2.md
    - 2026-11-28-zoe-tour-v3-usability.md

