# Facts about the household that decide what fits: the cars, the house, the
# bedroom, the budget. tools/fit.py reads `vehicles` and `home`.
#
# `null` means "not measured yet", never "zero" and never "fine". Every null
# here has a matching entry in research/open-questions.md under "Household
# facts". These are the household's facts to supply — agents must not guess
# them. Dimensions are inches.
#
# PRIVATE FACTS STAY OUT. This file is committed to git. The due date and
# other personal details are deliberately NOT recorded here or anywhere in
# the repo — Nick's choice, 2026-11-27. Do not add a field for them.

vehicles:
  - name: 2022 Tesla Model Y
    model_year: 2022
    trunk_in: [40, 35.75, 19]    # CONSERVATIVE stand-in from others' measurements, not ours
    frunk_in: [27.6, 13.8, 11]   # same; see the research note below
    rear_seat_width_in: null     # one 18 in figure exists (low confidence); see open question 4
    notes: >-
      The car we are buying for (Nick, 2026-11-27). trunk_in and frunk_in
      are the smallest figures reported by independent measurers of 2020-21
      Model Ys (same body), not a tape measure of our car — see
      research/notes/2026-11-27-model-y-2022-cargo-and-rear-seat.md.
      Replace them once measured. Lower LATCH anchors are on the second-row
      outboard seats only; the center seat is seat-belt install only (Tesla
      manual 2022.40).

# Cars that may come later. NOT checked by tools/fit.py — we are buying for
# `vehicles` above. Kept so a later purchase can be re-checked quickly.
future_vehicles:
  - name: 2026 Tesla Model Y L
    notes: >-
      Might be bought later, in addition to the 2022 Model Y (Nick,
      2026-11-27). Do not let it drive choices now.

home:
  narrowest_doorway_in: null     # the narrowest door a stroller must pass, open
  stairs_to_entry: null          # bool: must the stroller be carried up steps?
  stroller_storage_in: null      # [l, w, h] of where the folded stroller will live
  bedside_space_in: null         # [l, w] floor space next to the adult bed
  bed_top_height_in: null        # mattress top height, for bedside bassinets
  bed_notes: >-
    Queen mattress. The bed frame is upholstered (covered in fabric) and has
    a ledge that runs around the edge of the mattress (Nick, 2026-11-27).
    That ledge matters for bedside bassinets — see open question 19.

budget_usd:
  stroller: null
  car-seat: null
  bassinet: null

lifestyle:
  notes: >-
    The stroller will be used for travel right away, from the start,
    including flying. It will not be used for running or jogging (Nick,
    2026-11-27).

travel:
  flies: true                    # Nick, 2026-11-27
  airlines: [Delta, American Airlines]   # most often (Nick, 2026-11-27)
  overhead_bin_in: [22, 14, 9]   # carry-on size limit, same on both airlines (Delta
                                 # confirmed, AA unverified) — see research/notes/
                                 # 2026-11-27-delta-american-stroller-car-seat-policy.md
